<main id="content" class="wrap"><div class="hero"><div><h1>说到</h1><p class="lead">在 iPhone 上按住说话，松手记下待办。明确说出的提醒钟点，由系统在本机安排。</p><div class="actions"><a class="primary" href="support.html">使用帮助</a><a href="privacy.html">查看隐私政策</a></div></div><img class="hero-icon" src="assets/app-icon.png" width="256" height="256" alt="说到 App 图标"></div>
<div class="features"><section><h2>说出钟点</h2><p>说「下周一早上九点提醒我交房租」，清单会显示周一 09:00 的提醒。</p></section><section><h2>当场改字</h2><p>点保存回执里的标题就能修改文字，原来的提醒时刻和备注会保留。</p></section><section><h2>自己选择日历</h2><p>平时使用本机清单，需要共享日程时，再从待办详情同步到所选日历。</p></section></div></main>
